  detail: >-
    The Slate-generated Nowsta Integration API reference at developer.nowsta.com no longer resolves -
    DNS returns NXDOMAIN. The API itself is still live (an unauthenticated POST to
    https://api.nowsta.com/integrations/v1/events/publications returns the documented
    401 / code 1000 on 2026-08-01), so the contract is running without published documentation. The
    last full capture is https://web.archive.org/web/20240603053309/https://developer.nowsta.com/ and
    is the source for this repo's OpenAPI, error catalog and conventions.
  risk: >-
    A live but undocumented API is a real integration risk for partners: there is no current canonical
    reference, no changelog to detect drift, and no deprecation signal.
