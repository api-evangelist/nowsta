apis:
- name: Nowsta Integration API
  description: >-
    Allow-listed partner API for publishing workforce data into Nowsta. Six bulk "publications"
    endpoints - events (with nested shifts), venues, clients, uniforms, positions and workers - each
    accepting up to 32 objects per request and performing create-or-update keyed on the caller's own
    external id. Authentication is a per-company bearer token that the customer retrieves from the
    Nowsta UI; Nowsta must approve a company before its token is active. Every successful publication
    returns 202 Accepted with a queued-job id, because Nowsta will not apply changes that would
    unassign already-scheduled staff without coordinator confirmation. There are no read, PATCH or
    DELETE operations in the public surface, and no documented webhook or event stream.
  humanURL: https://web.archive.org/web/20240603053309/https://developer.nowsta.com/
  baseURL: https://api.nowsta.com
