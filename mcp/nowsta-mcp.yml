auth:
  scheme: bearer
  detail: >-
    A per-company Nowsta integration token would have to be supplied to any MCP server built on this
    surface. The token is not scoped - it authorizes every write operation for the whole company - so
    an MCP deployment should add its own guardrails.
caveats:
- >-
  Every operation in this API is a WRITE. There are no read operations, so an agent using these tools
  cannot inspect current state before or after changing it, and cannot verify what a 202 actually
  applied.
- >-
  Nowsta returns 202 Accepted with a queued-job id and publishes no way to poll that job, so tool
  results are inherently unconfirmed.
- >-
  Publications are full-object upserts - a tool call built from a partial object will silently clear
  the fields it omits. Any MCP tool over this API must require the complete object.
- >-
  publish_workers transmits worker PII (name, email, phone, home address, birthday, emergency contact,
  payroll id) and can desynchronize a record shared across employers. It should be gated behind human
  approval in any agent deployment.
